<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Humble Resort</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --sea-glass:#DDEFEA;
  --sun:#E7A93C;
  --ink:#fff;
  --muted:#D9E6E3;
  --serif:"Fraunces", Georgia, serif;
  --sans:"Instrument Sans", system-ui, sans-serif;
  --glass:rgba(10,30,34,.42);
  --glass-line:rgba(255,255,255,.18);
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;background:#06181B}
body{margin:0;font-family:var(--sans);font-size:16px;line-height:1.6;color:var(--ink);min-height:100vh}
a{color:inherit}
:focus-visible{outline:2px solid var(--sun);outline-offset:3px}

/* Cinematic slideshow background */
.stage{position:fixed;inset:0;z-index:-1;overflow:hidden;background:#06181B}
.slide{position:absolute;inset:-4%;background-size:cover;background-position:center 40%;opacity:0;
  transition:opacity 2.2s ease-in-out;will-change:opacity,transform;transform:scale(1.02)}
.slide.on{opacity:1;animation:drift 9s ease-out both}
.slide.prev{opacity:0}
@keyframes drift{from{transform:scale(1.02) translate3d(0,0,0)}to{transform:scale(1.12) translate3d(-1.2%,-.8%,0)}}
.scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,18,21,.55) 0%,rgba(4,18,21,.15) 35%,rgba(4,18,21,.55) 75%,rgba(4,18,21,.85) 100%)}
.grain{position:absolute;inset:0;opacity:.06;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

/* Intro sweep */
.hero{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;padding:28px 22px 120px}
.brand{position:absolute;top:calc(22px + env(safe-area-inset-top,0px));left:22px;font-size:14px;letter-spacing:.04em;font-weight:500;opacity:.9}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(56px,16vw,120px);line-height:.92;margin:0 0 16px;
  font-variation-settings:"opsz" 144;letter-spacing:-.01em;text-shadow:0 2px 30px rgba(0,0,0,.25)}
.hero h1 .w{display:inline-block;opacity:0;transform:translateY(24px) scale(.98);filter:blur(6px);
  animation:reveal 1.4s cubic-bezier(.2,.7,.2,1) forwards}
.hero h1 .w:nth-child(2){animation-delay:.25s}
@keyframes reveal{to{opacity:1;transform:none;filter:blur(0)}}
.hero .lede{margin:0;max-width:30ch;font-size:17px;color:var(--muted);opacity:0;animation:fadeup 1.2s .7s ease forwards}
@keyframes fadeup{to{opacity:1}}
.scroll-cue{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);font-size:13px;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;opacity:.85}
.scroll-cue i{width:1px;height:34px;background:linear-gradient(var(--sun),transparent);animation:cue 2.2s ease-in-out infinite}
@keyframes cue{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* Glass panels */
.glass{background:var(--glass);border:1px solid var(--glass-line);border-radius:22px;
  -webkit-backdrop-filter:blur(16px) saturate(1.2);backdrop-filter:blur(16px) saturate(1.2)}

.search{margin:0 16px;padding:18px;position:relative;z-index:2}
.search form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.wide{grid-column:1 / -1}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select{font:inherit;font-size:16px;padding:12px;border:1px solid rgba(255,255,255,.28);border-radius:12px;
  background:rgba(255,255,255,.92);color:#16292B;width:100%;min-width:0}
.btn{font:inherit;font-weight:600;font-size:16px;border:0;border-radius:14px;padding:15px 18px;cursor:pointer;background:var(--sun);color:#16292B;grid-column:1 / -1;transition:transform .15s,filter .2s}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:scale(.985)}
.msg{font-size:14px;margin:4px 0 0;color:#FFD6CC;min-height:1em;grid-column:1 / -1}

section{position:relative;padding:72px 22px}
section h2{font-family:var(--serif);font-weight:400;font-size:38px;line-height:1.08;margin:0 0 10px}
.intro{color:var(--muted);max-width:34ch;margin:0 0 26px}

/* Rooms */
.rooms{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -22px;padding:4px 22px 18px;scrollbar-width:none}
.rooms::-webkit-scrollbar{display:none}
.room{flex:0 0 82%;max-width:330px;scroll-snap-align:start;overflow:hidden;display:flex;flex-direction:column;border-radius:22px}
.room .art{height:200px;background-size:cover;background-position:center 35%;position:relative;transition:transform 1.2s ease}
.room:hover .art{transform:scale(1.04)}
.room .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.room h3{font-family:var(--serif);font-weight:400;font-size:24px;margin:0;line-height:1.15}
.room .meta{font-size:14px;color:var(--muted);margin:0}
.room .row{display:flex;align-items:flex-end;justify-content:space-between;margin-top:auto;padding-top:12px;gap:10px}
.price{font-size:22px;font-weight:600}
.price small{font-size:13px;font-weight:500;color:var(--muted)}
.pick{font:inherit;font-weight:600;font-size:15px;border:1.5px solid #fff;background:transparent;color:#fff;border-radius:999px;padding:9px 16px;cursor:pointer;transition:background .2s,color .2s}
.pick:hover{background:#fff;color:#16292B}

.why ul{list-style:none;margin:0;padding:22px;display:grid;gap:18px}
.why li{padding-left:18px;border-left:3px solid var(--sun)}
.why li strong{display:block;font-weight:600;font-size:17px}
.why li span{color:var(--muted);font-size:15px}
.why{margin:0 16px 40px;padding:0;position:relative}

#summary{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:rgba(8,26,29,.92);
  border:1px solid var(--glass-line);color:#fff;border-radius:18px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  transform:translateY(160%);transition:transform .45s cubic-bezier(.2,.7,.2,1);z-index:10;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#summary.show{transform:none}
#summary .txt{font-size:14px;line-height:1.35;min-width:0}
#summary .txt b{display:block;font-size:16px}
#summary button{font:inherit;font-weight:600;background:var(--sun);color:#16292B;border:0;border-radius:12px;padding:12px 16px;cursor:pointer;white-space:nowrap}

.dots{position:fixed;right:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;z-index:5}
.dots button{width:8px;height:8px;border-radius:50%;border:1px solid #fff;background:transparent;padding:0;cursor:pointer;transition:background .4s,transform .4s}
.dots button.on{background:var(--sun);border-color:var(--sun);transform:scale(1.25)}

footer{position:relative;padding:20px 22px 150px;color:var(--muted);font-size:14px}
footer p{margin:0 0 6px}

@media (prefers-reduced-motion:reduce){
  .slide.on{animation:none}
  .slide{transition:none}
  .hero h1 .w,.hero .lede{animation:none;opacity:1;transform:none;filter:none}
  .scroll-cue i{animation:none}
  html{scroll-behavior:auto}
}
</style>
</head>
